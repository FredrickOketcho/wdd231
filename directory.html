<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chamber Directory | Fremer City Chamber of Commerce</title>
  <meta name="description" content="Directory page for the Chamber of Commerce showcasing local businesses and members.">
  <meta name="author" content="Fredrick Oketcho">

  <!-- Favicon -->
  <link rel="icon" href="images/favicon.ico" type="image/x-icon">

  <!-- Facebook / Open Graph Meta Tags -->
  <meta property="og:title" content="Chamber Directory | Fremer City Chamber of Commerce">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://FredrickOketcho.github.io/wdd231/chamber/images/og-image.jpg">
  <meta property="og:url" content="https://FredrickOketcho.github.io/wdd231/chamber/directory.html">
  <meta property="og:description" content="Discover local businesses and members of the Chamber of Commerce.">

  <!-- Linked Resources -->
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/small.css">
  <link rel="stylesheet" href="css/larger.css">
  <script src="js/scripts.js" defer></script>
</head>
<body>
  <!-- Header: Logo and Site Title -->
  <header>
    <img src="images/logo.svg" alt="Chamber Logo" width="100" height="100">
    <h1>Fremer City Chamber of Commerce</h1>
  </header>

  <!-- Navigation: Hamburger Button and Nav Links -->
  <nav>
    <button id="menu" aria-label="Toggle Navigation">&#9776;</button>
    <ul class="navigation">
      <li><a href="directory.html" class="active">Directory</a></li>
    </ul>
  </nav>

  <!-- Main Content: Directory View Toggle & Member Container -->
  <main>
    <h2>Business Directory</h2>

    <!-- View Selection Buttons (Grid vs List) -->
    <div class="views">
      <button id="grid" aria-label="Grid View" class="active">Grid View</button>
      <button id="list" aria-label="List View">List View</button>
    </div>

    <!-- Container for Dynamically Rendered JSON Cards -->
    <article id="members" class="grid"></article>
  </main>

  <!-- Footer: Contact Info & Dev Details -->
  <footer>
    <div class="footer-contact">
      <p><strong>Fremer City Chamber of Commerce</strong></p>
      <p>123 Main Street, Kampala, ST 12345</p>
      <p>info@fremercitychamber.org | (256) 701-9868-35</p>
    </div>
    <div class="footer-dev">
      <p>&copy; <span id="currentyear"></span> | Fredrick Oketcho | WDD 231</p>
      <p id="lastModified"></p>
    </div>
  </footer>
</body>
</html>
